<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#cdc7b0">
<title>Spire Boy — スレスパ2 リモート</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --shell:#cdc7b0; --shell2:#bfb99f; --ink:#20242b; --bezel:#23262e; --bezel2:#31353f;
    --accent:#a51c4d; --accent2:#7e1239; --btn:#ece7d3; --btn-edge:#20242b;
    --u: 1vmin;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
    background:linear-gradient(180deg,var(--shell) 0%,var(--shell2) 100%);
    color:var(--ink);
    height:100vh; height:100dvh; overflow:hidden;
    display:flex; flex-direction:column; align-items:center;
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  #main{flex:1 1 auto; min-height:0; width:100%; max-width:600px; display:flex; flex-direction:column;}
  /* ---------- status bar ---------- */
  #bar{flex:none; display:flex; align-items:center; gap:6px; padding:2px 0 6px;}
  #dot{width:11px; height:11px; border-radius:50%; background:#c0392b; box-shadow:0 0 0 2px rgba(0,0,0,.15) inset; flex:none;}
  #dot.ok{background:#27ae60;} #dot.busy{background:#e67e22;}
  #statustext{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0;}
  .pillbtn{border:2px solid var(--btn-edge); background:var(--btn); color:var(--ink); border-radius:999px;
    padding:6px 12px; font-size:13px; font-weight:700; box-shadow:0 2px 0 var(--btn-edge); cursor:pointer; flex:none;}
  .pillbtn:active{transform:translateY(2px); box-shadow:none;}
  .pillbtn.danger{color:var(--accent2); border-color:var(--accent2); box-shadow:0 2px 0 var(--accent2);}
  .pillbtn.icon{padding:6px 9px;}
  /* ---------- token panel ---------- */
  #tokenpanel{flex:none; display:none; background:#f4efdb; border:2px solid var(--btn-edge); border-radius:12px;
    padding:10px 12px; margin-bottom:8px; box-shadow:0 3px 0 rgba(32,36,43,.5);}
  #tokenpanel.open{display:block;}
  #tokenpanel .tt{display:flex; align-items:center; gap:8px; font-weight:800; font-size:14px;}
  #tokenstate{font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; background:#c0392b; color:#fff;}
  #tokenstate.set{background:#27ae60;}
  #tokenpanel .desc{font-size:11px; opacity:.75; margin:6px 0 8px; line-height:1.5;}
  #tokenpanel .row{display:flex; gap:6px;}
  #tokeninput{flex:1; min-width:0; font-size:13px; padding:9px 10px; border-radius:10px;
    border:2px solid var(--btn-edge); background:#fff; color:var(--ink);}
  #tokenclear{border:2px solid #8a8570; background:transparent; color:#6d6852; border-radius:999px;
    padding:6px 10px; font-size:12px; font-weight:700; cursor:pointer; flex:none;}
  /* ---------- screen bezel ---------- */
  #bezel{flex:1 1 auto; min-height:0; display:flex; flex-direction:column;
    background:linear-gradient(180deg,var(--bezel2),var(--bezel));
    border-radius:14px 14px 44px 14px; padding:8px 8px 4px;
    box-shadow:0 4px 14px rgba(0,0,0,.35), 0 2px 0 rgba(255,255,255,.35) inset;}
  #screenbox{flex:1 1 auto; min-height:0; position:relative; background:#000; border-radius:6px; overflow:hidden;}
  #screen{position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:contain; touch-action:none; background:#000;}
  #brand{flex:none; display:flex; justify-content:space-between; align-items:baseline; padding:3px 4px 2px; color:#e8e2cc;}
  #brand .logo{font-weight:900; font-style:italic; letter-spacing:.14em; font-size:15px;}
  #brand .fps{font-size:11px; opacity:.75; font-variant-numeric:tabular-nums;}
  /* ---------- deck ---------- */
  #deck{flex:none; width:100%; max-width:600px; padding:8px 2px 0;}
  #mid{display:flex; justify-content:space-between; align-items:flex-start;}
  #dpad{display:grid; grid-template-columns:repeat(3, clamp(32px, 10vmin, 46px)); grid-template-rows:repeat(3, clamp(32px, 10vmin, 46px));
    filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));}
  #dpad button{background:#26282f; border:none; color:#d8d2ba; font-size:17px; cursor:pointer; padding:0;}
  #dpad button:active{background:#3a3d47;}
  #dpad .up{grid-area:1/2; border-radius:7px 7px 0 0;}
  #dpad .left{grid-area:2/1; border-radius:7px 0 0 7px;}
  #dpad .center{grid-area:2/2;}
  #dpad .right{grid-area:2/3; border-radius:0 7px 7px 0;}
  #dpad .down{grid-area:3/2; border-radius:0 0 7px 7px;}
  #ab{display:flex; gap:14px; transform:rotate(-14deg); padding-top:8px; padding-right:6px;}
  .abwrap{display:flex; flex-direction:column; align-items:center; gap:2px;}
  .abbtn{width:clamp(44px, 13.5vmin, 60px); height:clamp(44px, 13.5vmin, 60px); border-radius:50%; border:none; cursor:pointer;
    background:radial-gradient(circle at 32% 28%, #d6336c, var(--accent) 55%, var(--accent2));
    color:#fff; font-size:21px; font-weight:900; box-shadow:0 4px 0 rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.3);}
  .abbtn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.35);}
  .ablabel{font-size:11px; font-weight:700; transform:rotate(14deg);}
  #ssrow{display:flex; justify-content:center; gap:34px; margin-top:2px;}
  .sswrap{display:flex; flex-direction:column; align-items:center; gap:2px;}
  .ssbtn{width:56px; height:15px; border-radius:999px; border:none; cursor:pointer;
    background:linear-gradient(180deg,#8f8a76,#6f6a58); box-shadow:0 2px 0 rgba(0,0,0,.3); transform:rotate(-14deg);}
  .ssbtn:active{transform:rotate(-14deg) translateY(2px); box-shadow:none;}
  .sslabel{font-size:10px; font-weight:700; letter-spacing:.08em;}
  .secttl{font-size:12px; font-weight:700; margin:8px 2px 4px; opacity:.85;}
  #utilrow{display:grid; grid-template-columns:repeat(6,1fr); gap:6px;}
  #utilrow button{border:2px solid var(--btn-edge); background:var(--btn); border-radius:10px; padding:6px 0;
    font-size:12px; font-weight:700; box-shadow:0 2px 0 var(--btn-edge); cursor:pointer;}
  #utilrow button:active{transform:translateY(2px); box-shadow:none;}
  #utilrow button small{display:block; font-size:9px; font-weight:600; opacity:.65;}
  #cards{display:grid; grid-template-columns:repeat(5,1fr); gap:6px;}
  #cards button{border:2px solid var(--btn-edge); background:var(--btn); border-radius:10px; padding:clamp(6px, 1.8vmin, 10px) 0;
    font-size:clamp(14px, 4.4vmin, 18px); font-weight:800; box-shadow:0 2px 0 var(--btn-edge); cursor:pointer;}
  #cards button:active{transform:translateY(2px); box-shadow:none;}
  #actions{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:8px;}
  #actions button{border:2px solid var(--btn-edge); background:var(--btn); border-radius:999px; padding:8px 0;
    font-size:13px; font-weight:700; box-shadow:0 2px 0 var(--btn-edge); cursor:pointer;}
  #actions button:active{transform:translateY(2px); box-shadow:none;}
  #actions .endturn{border-color:#5b4a1f; box-shadow:0 2px 0 #5b4a1f; background:#f3e5bb;}
  #actions .danger{color:var(--accent2); border-color:var(--accent2); box-shadow:0 2px 0 var(--accent2);}
  #hint{font-size:11px; opacity:.65; margin-top:6px; line-height:1.5;}
  #statepanel{margin-top:10px; border:2px solid var(--btn-edge); border-radius:12px; background:var(--btn);}
  #sttoggle{display:flex; flex-wrap:wrap; align-items:center; gap:6px; width:100%; border:0; border-radius:10px;
    background:var(--shell2); color:var(--ink); padding:8px; text-align:left; cursor:pointer;}
  #stscreen{border:1px solid var(--btn-edge); border-radius:999px; padding:1px 6px; font-size:11px;}
  #stconnection{font-size:11px; flex:1; min-width:120px;}
  #stbody{padding:8px; max-height:32dvh; overflow-y:auto;}
  #stinfo{white-space:pre-line; font-size:12px; line-height:1.5;}
  #sthand, #stchoices{display:flex; flex-wrap:wrap; gap:6px; margin-top:7px;}
  #statepanel .pillbtn{white-space:normal; border-radius:10px; font-size:12px; text-align:left; max-width:100%;}
  #statepanel button:disabled{opacity:.45; cursor:default;}
  .stcard{flex:1 1 140px; min-width:0;}
  .stcard > button{width:100%;}
  .stcard small{display:block; font-weight:400; margin-top:3px;}
  .sttargets{display:flex; flex-wrap:wrap; gap:4px; margin-top:5px;}
  .sttargets[hidden]{display:none;}
  #sterror{font-size:11px; color:var(--accent2); margin-top:6px;}
  @media (orientation:portrait){#deck{max-height:55dvh; overflow-y:auto;} #bezel{min-height:100px;}}
  #toast{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px);
    background:#20242b; color:#f0ead2; padding:9px 16px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none;
    transition:all .25s; max-width:92vw; text-align:center; z-index:60;}
  #toast.show{opacity:.96; transform:translateX(-50%) translateY(0);}
  /* ---------- fullscreen overlay (Switch-emu style, landscape) ---------- */
  #fs{position:fixed; inset:0; width:100vw; width:100dvw; height:100vh; height:100dvh;
    background:#000; display:none; z-index:50; overflow:hidden;}
  #fs.open{display:block;}
  #fsimg{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; touch-action:none; background:#000;}
  .fsbtn{border:2px solid rgba(255,255,255,.45); background:rgba(18,20,26,.5); color:#fff; border-radius:999px;
    padding:9px 13px; font-size:13px; font-weight:700; cursor:pointer; backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);}
  .fsbtn:active{background:rgba(70,76,95,.65);}
  .fsbtn.round{width:42px; height:42px; border-radius:50%; padding:0; font-size:16px;}
  #fstop{position:absolute; top:calc(8px + env(safe-area-inset-top)); right:calc(10px + env(safe-area-inset-right));
    display:flex; gap:8px; z-index:3;}
  /* portrait hint chip (non-blocking) */
  #fsrot{display:none; position:absolute; top:calc(12px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    background:rgba(10,12,16,.6); color:#fff; font-size:12px; font-weight:700; padding:6px 14px; border-radius:999px;
    pointer-events:none; z-index:3; white-space:nowrap; backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);}
  @media (orientation: portrait){
    #fsrot{display:block; animation:fsrotfade 6s ease forwards;}
  }
  @keyframes fsrotfade{0%,70%{opacity:1;} 100%{opacity:0;}}
  /* translucent D-pad, bottom-left */
  #fsdpad{position:absolute; left:calc(12px + env(safe-area-inset-left)); bottom:calc(16px + env(safe-area-inset-bottom));
    display:grid; grid-template-columns:repeat(3, 46px); grid-template-rows:repeat(3, 46px); z-index:2;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));}
  #fsdpad button{background:rgba(18,20,26,.5); border:1.5px solid rgba(255,255,255,.35); color:rgba(255,255,255,.92);
    font-size:16px; cursor:pointer; padding:0; backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);}
  #fsdpad button:active{background:rgba(80,88,110,.65);}
  #fsdpad .up{grid-area:1/2; border-radius:10px 10px 0 0;}
  #fsdpad .left{grid-area:2/1; border-radius:10px 0 0 10px;}
  #fsdpad .center{grid-area:2/2;}
  #fsdpad .right{grid-area:2/3; border-radius:0 10px 10px 0;}
  #fsdpad .down{grid-area:3/2; border-radius:0 0 10px 10px;}
  /* translucent round buttons, bottom-right */
  #fsab{position:absolute; right:calc(12px + env(safe-area-inset-right)); bottom:calc(16px + env(safe-area-inset-bottom));
    display:flex; align-items:flex-end; gap:10px; z-index:2;}
  .fsabwrap{display:flex; flex-direction:column; align-items:center; gap:2px;}
  .fsabbtn{width:56px; height:56px; border-radius:50%; border:2px solid rgba(255,255,255,.45);
    background:rgba(165,28,77,.45); color:#fff; font-size:19px; font-weight:900; cursor:pointer;
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); box-shadow:0 3px 6px rgba(0,0,0,.35);}
  .fsabbtn:active{background:rgba(165,28,77,.75); transform:translateY(2px);}
  .fsabbtn.util{background:rgba(18,20,26,.5); font-size:16px;}
  .fsabbtn.util:active{background:rgba(70,76,95,.65);}
  .fsablabel{font-size:10px; font-weight:700; color:rgba(255,255,255,.85); text-shadow:0 1px 2px rgba(0,0,0,.8);}
  /* card number strip, bottom center, horizontally scrollable */
  #fsnums{position:absolute; bottom:calc(10px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    display:flex; gap:4px; max-width:44vw; overflow-x:auto; overflow-y:hidden; z-index:2;
    padding:2px; scrollbar-width:none; -webkit-overflow-scrolling:touch;}
  #fsnums::-webkit-scrollbar{display:none;}
  #fsnums button{flex:none; width:34px; height:38px; border-radius:8px; border:2px solid rgba(255,255,255,.4);
    background:rgba(18,20,26,.5); color:#fff; font-size:14px; font-weight:800; cursor:pointer;
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);}
  #fsnums button:active{background:rgba(90,96,115,.7);}
  @media (orientation: portrait){
    #fsnums{max-width:62vw;}
    #fsdpad{grid-template-columns:repeat(3, 42px); grid-template-rows:repeat(3, 42px); bottom:calc(64px + env(safe-area-inset-bottom));}
    #fsab{bottom:calc(64px + env(safe-area-inset-bottom));}
    .fsabbtn{width:50px; height:50px;}
  }
  /* ---------- short screens: compact deck ---------- */
  @media (max-height: 720px){
    .secttl{display:none;}
    #hint{display:none;}
    #deck{padding-top:5px;}
    #utilrow button{padding:4px 0;}
    #actions{margin-top:6px;}
    #brand .logo{font-size:13px;}
  }
  /* ---------- landscape phones: side-by-side ---------- */
  @media (orientation: landscape) and (max-height: 540px){
    body{flex-direction:row; align-items:stretch; padding:6px;}
    #main{max-width:none; flex:1 1 auto; min-width:0;}
    #deck{width:min(42%, 360px); max-width:none; flex:none; height:100%; overflow-y:auto; padding:2px 2px 2px 10px;}
    #bezel{border-radius:14px;}
    #ssrow{gap:20px;}
  }
  /* ---------- wide screens ---------- */
  @media (min-width: 900px){
    #main, #deck{max-width:680px;}
  }
</style>
</head>
<body>
  <div id="main">
    <div id="bar">
      <div id="dot"></div>
      <div id="statustext">接続中…</div>
      <span id="fpsbar" style="font-size:11px; opacity:.7; font-variant-numeric:tabular-nums; flex:none; white-space:nowrap;"></span>
      <button class="pillbtn icon" id="audiobtn" title="サウンド ON/OFF">🔇</button>
      <button class="pillbtn icon" id="tokenbtn" title="接続トークン">🔑</button>
      <button class="pillbtn icon" id="fsbtn" title="全画面">⛶</button>
      <button class="pillbtn" id="launch">▶ 起動</button>
      <button class="pillbtn danger" id="quit">⏹ 終了</button>
    </div>

    <div id="tokenpanel">
      <div class="tt">接続トークン <span id="tokenstate">未設定</span></div>
      <div class="desc">開くリンクの「?t=」の後ろにある文字列です。1回保存すれば、この端末では次から入力不要になります。トークンは接続先PCの config.json にあるものと一致させてください。</div>
      <div class="row">
        <input id="tokeninput" type="text" placeholder="トークンを貼り付け" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="pillbtn" id="tokensave">保存</button>
        <button id="tokenclear">消去</button>
      </div>
    </div>

    <div id="bezel">
      <div id="screenbox"><img id="screen" alt="ゲーム画面"></div>
      <div id="brand"><span class="logo">SPIRE BOY</span><span class="fps" id="fps"></span></div>
    </div>
  </div>

  <div id="deck">
    <div id="mid">
      <div id="dpad">
        <button class="up" data-key="up">▲</button>
        <button class="left" data-key="left">◀</button>
        <button class="center" disabled></button>
        <button class="right" data-key="right">▶</button>
        <button class="down" data-key="down">▼</button>
      </div>
      <div id="ab">
        <div class="abwrap"><button class="abbtn" id="btnB">B</button><span class="ablabel">もどる</span></div>
        <div class="abwrap"><button class="abbtn" id="btnA">A</button><span class="ablabel">決定</span></div>
      </div>
    </div>
    <div id="ssrow">
      <div class="sswrap"><button class="ssbtn" id="btnSelect"></button><span class="sslabel">SELECT 前面</span></div>
      <div class="sswrap"><button class="ssbtn" id="btnStart"></button><span class="sslabel">START 選択</span></div>
    </div>

    <div class="secttl">よく使うキー（キーボード専用モード）</div>
    <div id="utilrow">
      <button data-key="tab">Tab<small>マップ</small></button>
      <button data-key="q">Q<small>デッキ</small></button>
      <button data-key="a">A<small>山札</small></button>
      <button data-key="d">D<small>捨て札</small></button>
      <button data-key="f">F<small>廃棄札</small></button>
      <button data-key="w">W<small>上部</small></button>
    </div>

    <div class="secttl">手札を番号で選ぶ（戦闘中）</div>
    <div id="cards"></div>

    <div id="actions">
      <button class="endturn" id="endturn">E：ターン終了</button>
      <button id="focus">⟳ 再接続</button>
      <button class="danger" id="forcequit">強制終了</button>
    </div>
    <section id="statepanel" aria-label="ゲーム状態">
      <button id="sttoggle" aria-expanded="true" aria-controls="stbody">
        <strong>ゲーム状態</strong><span id="stscreen">—</span><span id="stconnection">接続待ち…</span>
      </button>
      <div id="stbody">
        <div id="stinfo"></div><div id="sthand"></div><div id="stchoices"></div>
        <div id="sterror" role="status" aria-live="polite"></div>
      </div>
    </section>
    <div id="hint">画面タップ＝クリック／ドラッグ＝スワイプ／長押し＝拡大表示。⛶で全画面（横向き推奨）。十字キーとA/Bはキーボード専用モードのキー操作です。</div>
  </div>

  <div id="fs">
    <img id="fsimg" alt="ゲーム画面（全画面）">
    <div id="fstop">
      <button class="fsbtn round" id="fsaudio" title="サウンド ON/OFF">🔇</button>
      <button class="fsbtn round" id="fsclose" title="全画面を閉じる">✕</button>
    </div>
    <div id="fsrot">📱 横持ちがおすすめです</div>
    <div id="fsdpad">
      <button class="up" data-key="up">▲</button>
      <button class="left" data-key="left">◀</button>
      <button class="center" disabled></button>
      <button class="right" data-key="right">▶</button>
      <button class="down" data-key="down">▼</button>
    </div>
    <div id="fsab">
      <div class="fsabwrap"><button class="fsabbtn util" id="fsE">E</button><span class="fsablabel">終了</span></div>
      <div class="fsabwrap"><button class="fsabbtn" id="fsB">B</button><span class="fsablabel">もどる</span></div>
      <div class="fsabwrap"><button class="fsabbtn" id="fsA">A</button><span class="fsablabel">決定</span></div>
    </div>
    <div id="fsnums"></div>
  </div>

  <div id="toast"></div>

<script>
"use strict";
let TOKEN = new URLSearchParams(location.search).get("t") || "";
try{
  if(TOKEN){ localStorage.setItem("spire_token", TOKEN); }
  else { TOKEN = localStorage.getItem("spire_token") || ""; }
}catch(e){}
const $ = id => document.getElementById(id);
const screenImg = $("screen"), fsImg = $("fsimg"), dot = $("dot"), statusText = $("statustext"), fpsEl = $("fps"), toast = $("toast");
let toastTimer = null;
function showToast(msg, ms){
  toast.textContent = msg; toast.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>toast.classList.remove("show"), ms || 2600);
}
/* The app may be opened from a URL whose relative paths resolve to a different
   backend (e.g. a home-screen icon launching at "/"). Probe once to find the
   base path that actually reaches this host, then use it for every call. */
let API_BASE = "";
async function probeBase(){
  const tries = ["", "/spire/"];
  for(const b of tries){
    if(b === API_BASE) continue;
    try{
      const ctl = new AbortController();
      const tm = setTimeout(() => ctl.abort(), 4000);
      const r = await fetch(b + "api/status", {headers:{"X-Token":TOKEN}, cache:"no-store", signal:ctl.signal});
      clearTimeout(tm);
      const j = await r.json().catch(() => null);
      if(j && ("ok" in j)){ API_BASE = b; return; }
    }catch(e){ /* try next */ }
  }
}
function api(path, body){
  const opt = {headers:{"X-Token":TOKEN}};
  if(body !== undefined){ opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  return fetch(API_BASE + path, opt).then(async r => {
    const result = await r.json().catch(()=>({ok:false, error:"bad_response"}));
    if(!r.ok) return {...result, ok:false, error:result.error === "network" ? "http_error" : (result.error || "http_error")};
    return result;
  }).catch(()=>({ok:false, error:"network"}));
}
async function postInput(body){
  let result = await api("api/input", body);
  if(result.error === "network"){
    await new Promise(resolve => setTimeout(resolve, 300));
    result = await api("api/input", body);
    if(result.error === "network") showToast("接続が不安定です（再接続中…）", 1800);
  }
  return result;
}

/* ---------- frame long-polling (works in iOS standalone PWA, unlike MJPEG) ----------
   The server holds ?since=<counter> requests until a newer frame exists
   (max 1.5s, then 204), so each frame is delivered the moment it is encoded
   and no bandwidth is wasted re-fetching duplicates. */
let lastCounter = -1, lastFrameAt = 0, blobUrl = null, polling = false, framesShown = 0, fpsT0 = Date.now();
const fpsBar = $("fpsbar");
const frameWidths = [1152, 960, 854, 720];
let widthIndex = 1, fastWindows = 0, fetchTotal = 0, fetchCount = 0;
function updateFrameProfile(){
  const now = Date.now(), elapsed = now - fpsT0;
  if(elapsed < 2500) return;
  const fps = framesShown * 1000 / elapsed;
  const average = fetchCount ? fetchTotal / fetchCount : Infinity;
  if(average > 280 || fps < 8){
    widthIndex = Math.min(frameWidths.length - 1, widthIndex + 1);
    fastWindows = 0;
  } else if(average < 120 && fps >= 12.5){
    if(++fastWindows >= 3){ widthIndex = Math.max(0, widthIndex - 1); fastWindows = 0; }
  } else { fastWindows = 0; }
  const label = fps.toFixed(1) + " fps · " + frameWidths[widthIndex] + "px";
  fpsEl.textContent = label; if(fpsBar) fpsBar.textContent = label;
  framesShown = 0; fpsT0 = now; fetchTotal = 0; fetchCount = 0;
}
async function poll(){
  if(polling) return; polling = true;
  while(true){
    try{
      const url = API_BASE + "api/frame.jpg?w=" + frameWidths[widthIndex] + (lastCounter >= 0 ? ("&since=" + lastCounter) : "");
      const fetchStarted = performance.now();
      const r = await fetch(url, {headers:{"X-Token":TOKEN}, cache:"no-store"});
      if(r.status === 200){
        const counter = parseInt(r.headers.get("X-Frame-Counter") || "-1", 10);
        const blob = await r.blob();
        fetchTotal += performance.now() - fetchStarted; fetchCount++;
        if(counter !== lastCounter && blob.size > 0){
          lastCounter = counter; lastFrameAt = Date.now();
          const url2 = URL.createObjectURL(blob);
          screenImg.src = url2; fsImg.src = url2;
          if(blobUrl) URL.revokeObjectURL(blobUrl);
          blobUrl = url2;
          framesShown++;
        }
      } else if(r.status === 204){
        /* no new frame yet — immediately re-arm the long-poll */
      } else {
        await new Promise(res => setTimeout(res, 400));
      }
    }catch(e){ await new Promise(res => setTimeout(res, 400)); }
    updateFrameProfile();
  }
}

  }
}
/* ---------- direct touch on a screen image: tap / drag / long-press zoom ---------- */
function bindGestures(img){
  let g = null;
  function pos(e){
    const r = img.getBoundingClientRect();
    const natW = img.naturalWidth || 16, natH = img.naturalHeight || 9;
    const scale = Math.min(r.width / natW, r.height / natH);
    const dispW = natW * scale, dispH = natH * scale;
    const ox = r.left + (r.width - dispW) / 2, oy = r.top + (r.height - dispH) / 2;
    const x = (e.clientX - ox) / dispW, y = (e.clientY - oy) / dispH;
    return {x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y))};
  }
  img.addEventListener("pointerdown", e => {
    e.preventDefault(); img.setPointerCapture(e.pointerId);
    const p = pos(e);
    g = {sx:p.x, sy:p.y, lx:p.x, ly:p.y, t:Date.now(), downSent:false, longPressed:false, zoomed:false, timer:null};
    g.timer = setTimeout(() => {
      if(g && !g.downSent){
        g.longPressed = true;
        postInput({type:"hover", x:g.sx, y:g.sy});
        img.style.transform = "scale(2.1)"; img.style.transformOrigin = (g.sx*100)+"% "+(g.sy*100)+"%"; img.style.objectFit = "fill";
        g.zoomed = true;
        if(navigator.vibrate) navigator.vibrate(15);
      }
    }, 450);
  });
  img.addEventListener("pointermove", e => {
    if(!g || g.longPressed) return;
    const p = pos(e);
    const dx = p.x - g.sx, dy = p.y - g.sy;
    if(!g.downSent && Math.hypot(dx, dy) > 0.02){
      clearTimeout(g.timer);
      g.downSent = true;
      postInput({type:"down", x:g.sx, y:g.sy});
    }
    if(g.downSent && Math.hypot(p.x - g.lx, p.y - g.ly) > 0.008){
      g.lx = p.x; g.ly = p.y;
      postInput({type:"move", x:p.x, y:p.y});
    }
  });
  function endGesture(e){
    if(!g) return;
    clearTimeout(g.timer);
    const wasZoom = g.zoomed, wasDown = g.downSent, wasLong = g.longPressed;
    const sx = g.sx, sy = g.sy, lx = g.lx, ly = g.ly;
    g = null;
    img.style.transform = ""; img.style.objectFit = "";
    if(wasZoom || wasLong) return;
    if(wasDown){ postInput({type:"up", x:lx, y:ly}); }
    else { postInput({type:"tap", x:sx, y:sy}); }
  }
  img.addEventListener("pointerup", endGesture);
  img.addEventListener("pointercancel", endGesture);
  img.addEventListener("contextmenu", e => e.preventDefault());
}
bindGestures(screenImg);
bindGestures(fsImg);

/* ---------- bridge state panel (independent of video and direct input) ---------- */
let stateBusy = false, actionBusy = false, stateNextAt = 0, stateActions = [], selectedCard = null;
function stateVisible(){
  if(document.hidden || $("stbody").hidden || $("fs").classList.contains("open")) return false;
  const r = $("statepanel").getBoundingClientRect();
  return r.width > 0 && r.height > 0 && r.bottom > 0 && r.top < innerHeight;
}
function stateButton(label, action){
  const button = document.createElement("button");
  button.className = "pillbtn"; button.textContent = label; button.disabled = actionBusy;
  button.addEventListener("click", () => runStateAction(action.action_id));
  return button;
}
function renderState(state, actions){
  stateActions = actions;
  $("stscreen").textContent = state.screen || "unknown";
  $("stconnection").textContent = state.screen === "unknown" ? "接続済み（状態は未取得）" : "接続済み";
  const value = v => v == null ? "?" : String(v);
  const lines = [];
  if(state.run) lines.push("Act " + value(state.run.act) + " / フロア " + value(state.run.floor) + " / ゴールド " + value(state.run.gold));
  if(state.player){
    const p = state.player;
    lines.push("HP " + value(p.hp) + "/" + value(p.max_hp) + " · ブロック " + value(p.block) + " · ⚡ " + value(p.energy) + "/" + value(p.max_energy));
  }
  for(const enemy of state.enemies || []) lines.push(enemy.name + " · HP " + value(enemy.hp) + "/" + value(enemy.max_hp) + " · ブロック " + value(enemy.block) + " · " + value(enemy.intent));
  $("stinfo").textContent = lines.join("\n");
  $("sthand").replaceChildren(); $("stchoices").replaceChildren();
  for(const card of state.hand || []){
    const cardActions = actions.filter(a => a.kind === "play_card" && (a.action_id === "play_card:" + card.index || a.action_id.startsWith("play_card:" + card.index + ":")));
    const direct = cardActions.find(a => a.action_id === "play_card:" + card.index);
    const wrap = document.createElement("div"); wrap.className = "stcard";
    const button = document.createElement("button"); button.className = "pillbtn";
    button.textContent = (card.index + 1) + " " + card.name + " ⚡" + value(card.cost);
    const description = document.createElement("small");
    description.textContent = String(card.description || "").replace(/\s+/g, " ").slice(0, 100);
    button.appendChild(description);
    button.disabled = actionBusy || card.playable === false || !cardActions.length;
    const targets = document.createElement("div"); targets.className = "sttargets";
    targets.hidden = selectedCard !== card.index;
    if(!direct) for(const action of cardActions) targets.appendChild(stateButton(action.label, action));
    button.addEventListener("click", () => {
      if(direct) runStateAction(direct.action_id);
      else { selectedCard = selectedCard === card.index ? null : card.index; renderState(state, actions); }
    });
    wrap.append(button, targets); $("sthand").appendChild(wrap);
  }
  const kinds = new Set(["choose_map", "choose_event", "choose_rest", "claim_reward", "proceed", "use_potion", "end_turn"]);
  for(const action of actions) if(kinds.has(action.kind)) $("stchoices").appendChild(stateButton(action.label, action));
}
function clearStateActions(){
  stateActions = []; selectedCard = null;
  $("sthand").replaceChildren(); $("stchoices").replaceChildren(); $("stinfo").textContent = "";
  $("stscreen").textContent = "—";
}
async function refreshState(force=false){
  if(stateBusy || actionBusy || !stateVisible() || (!force && Date.now() < stateNextAt)) return;
  stateBusy = true; stateNextAt = Date.now() + 1500;
  try{
    const [state, actions] = await Promise.all([api("api/state"), api("api/actions")]);
    if(state.error || !Array.isArray(actions)){
      clearStateActions();
      const error = state.error || actions.error || "bridge_bad_response";
      $("stconnection").textContent = error === "bridge_unreachable" || error === "network" ? "ブリッジ未接続（SpireBridge mod が必要です）" : "状態取得失敗: " + error;
      stateNextAt = Date.now() + 5000;
      return;
    }
    renderState(state, actions);
  }catch(e){
    clearStateActions(); $("stconnection").textContent = "状態取得失敗"; stateNextAt = Date.now() + 5000;
  }finally{ stateBusy = false; }
}
async function runStateAction(actionId){
  if(actionBusy || stateBusy || !stateActions.some(a => a.action_id === actionId)) return;
  actionBusy = true; $("sterror").textContent = "";
  $("statepanel").querySelectorAll(".pillbtn").forEach(b => { b.disabled = true; });
  try{
    const result = await api("api/do", {action_id:actionId});
    if(!result.ok) $("sterror").textContent = "実行できませんでした: " + (result.error || "unknown");
    else selectedCard = null;
  }finally{
    actionBusy = false; clearStateActions();
    stateNextAt = Date.now() + 350;
    setTimeout(() => refreshState(true), 350);
  }
}
$("sttoggle").addEventListener("click", () => {
  $("stbody").hidden = !$("stbody").hidden;
  $("sttoggle").setAttribute("aria-expanded", String(!$("stbody").hidden));
  if(!$("stbody").hidden) refreshState(true);
});
document.addEventListener("visibilitychange", () => { if(!document.hidden) refreshState(); });
/* ---------- fullscreen ---------- */
const fsEl = $("fs");
function openFs(){
  fsEl.classList.add("open");
  try{ const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if(p && p.catch) p.catch(()=>{}); }catch(e){}
  try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(()=>{}); }catch(e){}
}
function closeFs(){
  fsEl.classList.remove("open");
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
}
$("fsbtn").addEventListener("click", openFs);
$("fsclose").addEventListener("click", closeFs);
$("fsaudio").addEventListener("click", () => $("audiobtn").click());
$("fsA").addEventListener("click", () => sendKey("enter"));

$("fsE").addEventListener("click", () => sendKey("e"));
/* ---------- actions ---------- */
$("launch").addEventListener("click", async () => {
  showToast("Steamから起動しています…", 5000);
  const r = await api("api/launch", {});
  showToast(r.ok ? "起動を開始しました" : ("起動失敗: " + (r.error || "")), 4000);
  setTimeout(refreshStatus, 1500);
});
async function quitGame(force){
  const r = await api("api/quit", {force: !!force});
  showToast(r.ok ? "終了しました" : ("終了失敗: " + (r.error || "")));
  setTimeout(refreshStatus, 800);
}

$("focus").addEventListener("click", async () => { lastCounter = -1; const r = await api("api/focus", {}); showToast(r.ok ? "再接続しました" : "再接続に失敗"); refreshStatus(); });
document.addEventListener("visibilitychange", () => { if(!document.hidden){ lastCounter = -1; refreshStatus(); } });
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
syncTokenUI();
(async () => { await probeBase(); refreshStatus(); setInterval(refreshStatus, 6000); refreshState(); setInterval(refreshState, 1500); poll(); })();
