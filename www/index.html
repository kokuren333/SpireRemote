<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#cdc7b0">
<title>Spire Remote — スレスパ2 リモート</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --shell:#cdc7b0; --shell2:#bfb99f; --ink:#20242b; --bezel:#23262e; --bezel2:#31353f;
    --accent:#a51c4d; --accent2:#7e1239; --btn:#ece7d3; --btn-edge:#20242b;
    --amber:#f3e5bb; --amber-edge:#5b4a1f; --cancel:#4a4d55;
    --z1-h:32px; --rowa-h:36px; --rowb-h:52px; --gap:4px; --band-max:52px; --chip-h:44px; --confirm-h:52px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{margin:0; padding:0; height:100%; overflow:hidden; overscroll-behavior:none; overscroll-behavior-x:none;}
  /* root scroller never moves sideways (body already overflow:hidden; this doubles it on html) */
  html{overflow-x:hidden; overflow-y:hidden;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
    background:linear-gradient(180deg,var(--shell) 0%,var(--shell2) 100%);
    color:var(--ink);
    height:100vh; height:100dvh; height:var(--app-height, 100dvh); overflow:hidden;
    display:flex; flex-direction:column; align-items:center;
    padding:calc(4px + env(safe-area-inset-top)) calc(4px + env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) calc(4px + env(safe-area-inset-left));
    user-select:none; -webkit-user-select:none; touch-action:manipulation;
  }
  /* four fixed zones: Z1 top bar / Z2 picture+bands / Z3 flow panel / Z4 utility bar */
  #app{flex:1 1 auto; min-height:0; width:100%; max-width:600px; display:flex; flex-direction:column; gap:var(--gap); position:relative;}
  /* ---------- buttons (Game Boy look only: cream face, 2px dark edge, hard drop shadow, sinks 2px) ---------- */
  .gb{border:2px solid var(--btn-edge); background:var(--btn); color:var(--ink); border-radius:10px; box-shadow:0 2px 0 var(--btn-edge);
    font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; padding:0 6px; min-width:0; line-height:1.2;}
  .gb:active{transform:translateY(2px); box-shadow:none;}
  .gb:disabled{opacity:.45; cursor:default;}
  .gb.ok{background:var(--accent); border-color:var(--accent2); box-shadow:0 2px 0 var(--accent2); color:#fff;}
  .gb.cancel{background:var(--cancel); color:#fff;}
  .gb.amber{background:var(--amber); border-color:var(--amber-edge); box-shadow:0 2px 0 var(--amber-edge);}
  .gb.armed{background:#ffd84a; border-color:var(--accent2); box-shadow:0 2px 0 var(--accent2); color:var(--accent2);}
  .gb.danger{color:var(--accent2); border-color:var(--accent2); box-shadow:0 2px 0 var(--accent2);}
  /* ---------- Z1 top bar ---------- */
  #z1{flex:none; height:var(--z1-h); display:flex; align-items:center; gap:4px; min-width:0; position:relative;}
  #dot{width:11px; height:11px; border-radius:50%; background:#c0392b; box-shadow:0 0 0 2px rgba(0,0,0,.15) inset; flex:none;}
  #dot.ok{background:#27ae60;} #dot.busy{background:#e67e22;}
  #stwrap{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; justify-content:center; line-height:1.2; overflow:hidden;}
  #stline{display:flex; gap:6px; min-width:0;}
  #statustext,#z1ctx{font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  #statustext{flex:1 1 auto;}
  #z1ctx{display:none; flex:1 1 auto; font-variant-numeric:tabular-nums;}
  body.noband #z1ctx{display:block;} body.noband #statustext{flex:0 1 auto; max-width:40%;}
  #fpsbar{font-size:10.5px; opacity:.72; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ib{flex:none; width:34px; height:30px; padding:0; font-size:15px; border-radius:9px;}
  /* ---------- Z2 picture box: picture + letterbox bands + arrow layer + touch chip ---------- */
  #screenbox{flex:none; position:relative; background:#000; border-radius:6px; overflow:hidden; height:calc(var(--app-height, 100dvh) * .32);}
  /* 2px frame drawn inside (inset shadow) so it never narrows the picture */
  #screenbox::after{content:""; position:absolute; inset:0; border-radius:6px; box-shadow:inset 0 0 0 2px var(--bezel); pointer-events:none; z-index:5;}
  #screenbox.touchon::after{box-shadow:inset 0 0 0 2px var(--accent);}
  #screen{position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:contain; touch-action:none; background:#000;}
  /* letterbox bands over the black bars (never over the picture) */
  #bandtop,#bandbottom{position:absolute; left:0; right:0; display:none; flex-direction:column; justify-content:center;
    padding:1px 10px; overflow:hidden; pointer-events:none; z-index:2; color:#f4efdc;
    text-shadow:0 1px 2px #000, 0 0 4px #000;}
  #bandtop{top:0; padding-right:44px;} #bandbottom{bottom:0;}
  #bandtop.on,#bandbottom.on{display:flex;}
  #bandname{font-size:15px; font-weight:800; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #banddesc{font-size:12px; line-height:1.3; opacity:.93; overflow:hidden;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2;}
  #bandl1,#bandl2{font-size:12px; line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    font-variant-numeric:tabular-nums;}
  #bandl2{opacity:.85;}
  #arrowlayer{position:absolute; inset:0; pointer-events:none; z-index:3; overflow:hidden;}
  #arrowlayer.hide{display:none;}
  #arrowlayer svg{position:absolute; inset:0; width:100%; height:100%; overflow:hidden;}
  .blink{animation:blink 1s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:1;} 50%{opacity:.35;}}
  @media (prefers-reduced-motion: reduce){ .blink{animation:none;} }
  #touchchip{position:absolute; top:4px; right:6px; z-index:4; height:28px; min-width:28px; padding:0 6px; border-radius:999px;
    border:1.5px solid rgba(255,255,255,.35); background:rgba(18,20,26,.55); color:#fff; font-size:13px; font-weight:700; opacity:.45; cursor:pointer;}
  #touchchip.on{opacity:1; background:var(--accent); border-color:#fff;}
  /* ---------- Z3 flow panel ---------- */
  #z3{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:var(--gap); overflow:hidden; position:relative;}
  #descrow{flex:none; height:34px; display:none; flex-direction:column; justify-content:center; padding:0 6px; background:#20242b; color:#f4efdc; border-radius:6px; overflow:hidden;}
  body.noband #descrow{display:flex;}
  #descname{font-size:12.5px; font-weight:800; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #descdesc{font-size:11px; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.9;}
  #flow{flex:1 1 auto; min-height:0; display:flex; flex-direction:column; gap:var(--gap); overflow:hidden; position:relative;}
  #flowmsg{font-size:13px; font-weight:700; line-height:1.45; padding:4px 2px;}
  #flowmsg:empty{display:none;}
  #enemyrow{flex:none; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px; position:relative;}
  #enemyrow:empty{display:none;}
  .echip{height:var(--chip-h); padding:2px 4px; text-align:left; display:flex; flex-direction:column; justify-content:center; position:relative; overflow:hidden;}
  .echip .el1{font-size:12px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .echip .el2{font-size:10.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums;}
  .echip.cand{border-style:dashed; border-color:var(--accent);}
  .echip.tsel{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent), 0 2px 0 var(--accent2);}
  .echip .emark{position:absolute; right:3px; top:1px; color:var(--accent); font-size:12px;}
  #enemynote{flex:none; font-size:10px; opacity:.7; text-align:right; margin-top:-3px;}
  #enemynote:empty{display:none;}
  #handgrid{flex:none; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); grid-auto-rows:minmax(var(--chip-h),64px); gap:4px;}
  #handgrid:empty{display:none;}
  #handgrid.rows2{grid-auto-rows:var(--chip-h);}
  .hchip{position:relative; padding:2px 3px; display:flex; flex-direction:column; align-items:stretch; justify-content:center; overflow:hidden; text-align:center;}
  .hchip .hn{position:absolute; left:3px; top:1px; font-size:10px; font-weight:800; opacity:.8;}
  .hchip .hname{font-size:11.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .hchip .hc{font-size:11px; font-weight:800;}
  .hchip .hbad{position:absolute; right:2px; top:1px; font-size:9px; font-weight:800; color:var(--accent2);}
  .hchip.dim{opacity:.55;} .hchip.noen .hc{color:#c0392b;}
  .hchip.sel{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent), 0 2px 0 var(--accent2); opacity:1;}
  .hchip.gfocus{outline:2px dashed var(--ink); outline-offset:1px;}
  #choicelist{flex:none; display:grid; grid-template-columns:minmax(0,1fr); gap:4px;}
  #choicelist:empty{display:none;}
  #choicelist.cols2{grid-template-columns:repeat(2,minmax(0,1fr));}
  .cbtn{min-height:44px; text-align:left; padding:2px 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cbtn.sel{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent), 0 2px 0 var(--accent2);}
  .cbtn.info{white-space:normal; font-weight:600; font-size:12px; min-height:40px;}
  .cbtn.info small{display:block; font-weight:400; opacity:.75; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2;}
  .bigbtn{min-height:64px; font-size:18px;}
  /* L-12: only these lists may scroll, and only vertically, inside Z3 */
  .scrolllist{flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain;}
  #potiontray{position:absolute; left:0; right:0; top:0; bottom:0; z-index:3; display:none; flex-direction:column; gap:4px;
    background:var(--shell); border-radius:8px;}
  #potiontray.open{display:flex;}
  #flow.combat #potiontray{top:48px;} #flow.combat.erow2 #potiontray{top:96px;}
  .prow{min-height:44px; text-align:left; padding:2px 8px; display:flex; flex-direction:column; justify-content:center;}
  .prow .pn{font-size:12.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .prow .pd{font-size:10.5px; font-weight:500; opacity:.8; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2;}
  .prow.dim{opacity:.55;} .prow.sel{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent), 0 2px 0 var(--accent2);}
  /* confirm bar: always 52px, whether or not something is selected (L-11) */
  #confirmbar{flex:none; height:var(--confirm-h); display:flex; gap:4px; align-items:stretch;}
  #confirmmsg{flex:1 1 auto; display:flex; align-items:center; justify-content:center; text-align:center; font-size:13px; font-weight:700;
    border:2px dashed rgba(32,36,43,.35); border-radius:10px; padding:0 6px; line-height:1.3; overflow:hidden;}
  #confirmmsg.err{color:#fff; background:var(--accent2); border:2px solid var(--accent2);}
  #cancelbtn{flex:none; width:88px;}
  #confirmbtn{flex:1 1 auto; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* ---------- Z4 utility bar: row A 36 + 4 + row B 52 ---------- */
  #z4{flex:none; display:flex; flex-direction:column; gap:var(--gap);}
  #rowa{height:var(--rowa-h); display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:4px;}
  body.norowa #rowa{display:none;}
  #rowa .gb{font-size:12px;}
  #rowb{height:var(--rowb-h); display:grid; grid-template-columns:62px minmax(0,1fr) minmax(0,1fr) minmax(0,1.7fr); gap:4px;}
  #rowb .gb{font-size:14px;}
  #mainact{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #mainact.armed,#fsmain.armed{white-space:normal; font-size:11.5px;}
  /* ---------- menu sheet (over Z3..Z4, grows upward; never pushes the layout) ---------- */
  #menu{position:absolute; left:0; right:0; bottom:0; max-height:100%; z-index:40; background:#f4efdb; border:2px solid var(--btn-edge);
    border-radius:14px; padding:8px 10px 10px; box-shadow:0 -3px 12px rgba(0,0,0,.35); display:flex; flex-direction:column; gap:6px; overflow:hidden;}
  .mhead{display:flex; align-items:center; justify-content:space-between; font-weight:800; font-size:14px;}
  .msec{font-size:11px; font-weight:800; opacity:.7; margin-top:2px;}
  .mradio{display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; min-height:30px; line-height:1.3;}
  .mradio input{flex:none; width:18px; height:18px; margin:0;}
  .mseg{display:grid; grid-template-columns:repeat(3,1fr); gap:4px;}
  .mseg label{display:flex; align-items:center; justify-content:center; gap:4px; font-size:12px; font-weight:700; min-height:32px;
    border:2px solid var(--btn-edge); border-radius:10px; background:var(--btn);}
  .mgrid{display:grid; grid-template-columns:1fr 1fr; gap:4px;}
  .mgrid .gb,#tokenbtn,#menuclose{min-height:36px;}
  #menurowa{display:none; grid-template-columns:repeat(5,minmax(0,1fr)); gap:4px;}
  #menurowa .gb{min-height:36px; font-size:12px;}
  body.norowa #menurowa{display:grid;}
  .minfo{font-size:10.5px; opacity:.7; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* ---------- token panel (inside the menu sheet) ---------- */
  #tokenpanel{display:none; background:#fffaf0; border:2px solid var(--btn-edge); border-radius:12px; padding:8px 10px;}
  #tokenpanel.open{display:block;}
  #tokenpanel .tt{display:flex; align-items:center; gap:8px; font-weight:800; font-size:13px;}
  #tokenstate{font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; background:#c0392b; color:#fff;}
  #tokenstate.set{background:#27ae60;}
  #tokenpanel .desc{font-size:11px; opacity:.75; margin:4px 0 6px; line-height:1.45;}
  #tokenpanel .row{display:flex; gap:6px;}
  #tokeninput{flex:1; min-width:0; font-size:13px; padding:8px 10px; border-radius:10px; border:2px solid var(--btn-edge); background:#fff; color:var(--ink);}
  #tokensave,#tokenclear{min-height:36px;}
  /* ---------- press feedback (filter only: never fights :active transforms/shadows) ---------- */
  button{transition:filter .14s ease-out;}
  button.pressed{filter:brightness(1.2) saturate(1.3) drop-shadow(0 0 4px rgba(255,226,140,.9));}
  /* ---------- send log: latest 2 pills over the Z1 status text (top-left while fullscreen) ---------- */
  #sendlog{position:fixed; top:calc(4px + env(safe-area-inset-top)); left:calc(22px + env(safe-area-inset-left)); height:var(--z1-h);
    right:calc(120px + env(safe-area-inset-right)); display:flex; flex-direction:row; align-items:center; gap:4px; pointer-events:none; z-index:61; overflow:hidden;}
  #sendlog .sl:nth-last-child(n+3){display:none;}
  #fs.open ~ #sendlog{top:calc(10px + env(safe-area-inset-top)); left:calc(10px + env(safe-area-inset-left)); right:auto; height:auto;
    flex-direction:column; align-items:flex-start; max-width:60vw;}
  #fs.open ~ #sendlog .sl{display:block;}
  #sendlog .sl{flex:0 1 auto; min-width:0; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; max-width:100%; background:rgba(32,36,43,.92); color:#f0ead2; box-shadow:0 1px 3px rgba(0,0,0,.35);}
  #sendlog .sl.ok{background:rgba(30,110,64,.95);}
  #sendlog .sl.ng{background:rgba(150,30,50,.95);}
  /* toast: near the bottom of Z2, centered; never over the utility bar (top set from JS) */
  #toast{position:fixed; left:50%; top:var(--toast-top, 30%); transform:translateX(-50%) translateY(8px);
    background:#20242b; color:#f0ead2; padding:9px 16px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none;
    transition:all .25s; max-width:92%; text-align:center; z-index:60;}
  #toast.show{opacity:.96; transform:translateX(-50%) translateY(0);}
  #fs.open ~ #toast{top:auto; bottom:calc(72px + env(safe-area-inset-bottom));}
  /* ---------- fullscreen: picture + direct touch only ---------- */
  #fs{position:fixed; inset:0;
    background:#000; display:none; z-index:50; overflow:hidden;}
  #fs.open{display:block;}
  #fsimg{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; touch-action:none; background:#000;}
  .fsbtn{border:2px solid rgba(255,255,255,.45); background:rgba(18,20,26,.5); color:#fff; border-radius:999px;
    padding:9px 13px; font-size:13px; font-weight:700; cursor:pointer; backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);}
  .fsbtn:active{background:rgba(70,76,95,.65);}
  .fsbtn.round{width:42px; height:42px; border-radius:50%; padding:0; font-size:16px;}
  .fsbtn.armed{background:rgba(255,216,74,.85); color:#20242b;}
  #fstop{position:absolute; top:calc(8px + env(safe-area-inset-top)); right:calc(10px + env(safe-area-inset-right));
    display:flex; gap:8px; z-index:3;}
  #fsbr{position:absolute; right:calc(10px + env(safe-area-inset-right)); bottom:calc(12px + env(safe-area-inset-bottom));
    display:flex; gap:8px; z-index:3; align-items:flex-end;}
  #fsbr .fsbtn{min-height:44px; min-width:64px;}
  #fsmain{max-width:180px;}
  /* portrait hint chip (non-blocking) */
  #fsrot{display:none; position:absolute; top:calc(12px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    background:rgba(10,12,16,.6); color:#fff; font-size:12px; font-weight:700; padding:6px 14px; border-radius:999px;
    pointer-events:none; z-index:3; white-space:nowrap; backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px);}
  @media (orientation: portrait){
    #fsrot{display:block; animation:fsrotfade 6s ease forwards;}
  }
  @keyframes fsrotfade{0%,70%{opacity:1;} 100%{opacity:0;}}
  /* ---------- landscape phones: picture left, control column right (not one-screen guaranteed) ---------- */
  @media (orientation: landscape) and (max-height: 540px){
    #app{max-width:none; display:grid; grid-template-columns:minmax(0,1fr) clamp(260px, 36vw, 340px);
      grid-template-rows:var(--z1-h) minmax(0,1fr) var(--rowb-h); column-gap:6px; row-gap:var(--gap);}
    #screenbox{grid-column:1; grid-row:1 / 4; height:auto !important;}
    #z1{grid-column:2; grid-row:1;}
    #z3{grid-column:2; grid-row:2; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain;}
    #z4{grid-column:2; grid-row:3;}
    #rowa{display:none;}
    #menurowa{display:grid;}
    #sendlog{left:calc(10px + env(safe-area-inset-left)); right:auto; max-width:50vw;}
  }
  /* ---------- wide screens: the portrait layout, centered, max 600px ---------- */
  @media (min-width: 900px), (orientation: landscape) and (min-height: 541px){
    #app{max-width:600px;}
    #sendlog{left:calc(50% - 278px); right:auto; max-width:300px;}
  }
</style>
</head>
<body>
  <div id="app">
    <header id="z1">
      <div id="dot"></div>
      <div id="stwrap">
        <div id="stline"><span id="z1ctx"></span><span id="statustext">接続中…</span></div>
        <span id="fpsbar"></span>
      </div>
      <button class="gb ib" id="audiobtn" title="サウンド ON/OFF">🔇</button>
      <button class="gb ib" id="fsbtn" title="全画面">⛶</button>
      <button class="gb ib" id="menubtn" title="メニュー">☰</button>
    </header>

    <div id="screenbox"><img id="screen" alt="ゲーム画面"><div id="bandtop"><div id="bandname"></div><div id="banddesc"></div></div><div id="bandbottom"><div id="bandl1"></div><div id="bandl2"></div></div><div id="arrowlayer"></div><button id="touchchip" title="画面タッチ（一時オン）">👆</button></div>

    <section id="z3" aria-label="操作パネル">
      <div id="descrow"><div id="descname"></div><div id="descdesc"></div></div>
      <div id="flow">
        <div id="flowmsg"></div>
        <div id="enemyrow"></div>
        <div id="enemynote"></div>
        <div id="handgrid"></div>
        <div id="choicelist"></div>
        <div id="potiontray"></div>
      </div>
      <div id="confirmbar">
        <div id="confirmmsg" role="status" aria-live="polite"></div>
        <button class="gb cancel" id="cancelbtn" hidden>✕ やめる</button>
        <button class="gb ok" id="confirmbtn" hidden></button>
      </div>
    </section>

    <nav id="z4">
      <div id="rowa">
        <button class="gb" id="ka_tab">マップ</button>
        <button class="gb" id="ka_q">デッキ</button>
        <button class="gb" id="ka_a">山札</button>
        <button class="gb" id="ka_d">捨て札</button>
        <button class="gb" id="ka_f">廃棄</button>
      </div>
      <div id="rowb">
        <button class="gb" id="potionbtn" disabled>🧪 0</button>
        <button class="gb" id="backbtn">戻る</button>
        <button class="gb" id="okbtn">決定</button>
        <button class="gb amber" id="mainact" disabled>—</button>
      </div>
    </nav>

    <div id="menu" hidden>

<script>
"use strict";
let TOKEN = new URLSearchParams(location.search).get("t") || "";

const $ = id => document.getElementById(id);
const screenImg = $("screen"), fsImg = $("fsimg"), dot = $("dot"), statusText = $("statustext"), fpsEl = $("fps"), toast = $("toast");
let toastTimer = null;
function showToast(msg, ms){

  clearTimeout(toastTimer); toastTimer = setTimeout(()=>toast.classList.remove("show"), ms || 2600);

/* The app may be opened from a URL whose relative paths resolve to a different
   backend (e.g. a home-screen icon launching at "/"). Probe once to find the
   base path that actually reaches this host, then use it for every call. */
let API_BASE = "";
async function probeBase(){
  const tries = ["", "/spire/"];
  for(const b of tries){
    if(b === API_BASE) continue;
    try{
      const ctl = new AbortController();
      const tm = setTimeout(() => ctl.abort(), 4000);
      const r = await fetch(b + "api/status", {headers:{"X-Token":TOKEN}, cache:"no-store", signal:ctl.signal});
      clearTimeout(tm);
      const j = await r.json().catch(() => null);
      if(j && ("ok" in j)){ API_BASE = b; return; }
    }catch(e){ /* try next */ }
  }
}
function api(path, body){
  const opt = {headers:{"X-Token":TOKEN}};
  if(body !== undefined){ opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  return fetch(API_BASE + path, opt).then(async r => {
    const result = await r.json().catch(()=>({ok:false, error:"bad_response"}));
    if(!r.ok) return {...result, ok:false, error:result.error === "network" ? "http_error" : (result.error || "http_error")};
    return result;
  }).catch(()=>({ok:false, error:"network"}));
}
/* One POST with the existing policy: a single 300ms retry, and only on network failure. */
async function sendInputOnce(body){
  let result = await api("api/input", body);
  if(result.error === "network"){
    await new Promise(resolve => setTimeout(resolve, 300));
    result = await api("api/input", body);
    if(result.error === "network") showToast("接続が不安定です（再接続中…）", 1800);

}
/* ---------- send log pills (over the Z1 status text; top-left while fullscreen) ---------- */
const sendLogEl = $("sendlog");

  let entry = reuse && sendLogEntries.includes(reuse) ? reuse : null;
  if(entry){ clearTimeout(entry.timer); entry.pending++; }
  else {
    const el = document.createElement("div");
    entry = {el, label, pending:1, failed:false, timer:null};
    sendLogEntries.push(entry);
    if(sendLogEntries.length > 4) sendLogEntries = sendLogEntries.slice(-4);
  }
  entry.el.className = "sl"; entry.el.textContent = "⏳ " + entry.label;
  renderSendLog();
  return entry;
}
function logEnd(entry, ok){
  if(!entry) return;
  entry.pending = Math.max(0, entry.pending - 1);
  if(!ok) entry.failed = true;
  if(entry.pending > 0) return;
  entry.el.className = "sl " + (entry.failed ? "ng" : "ok");
  entry.el.textContent = (entry.failed ? "✗ " : "✓ ") + entry.label;
  clearTimeout(entry.timer);
  entry.timer = setTimeout(() => { sendLogEntries = sendLogEntries.filter(e => e !== entry); renderSendLog(); }, entry.failed ? 4000 : 2600);

/* ---------- input latency: POST RTT, and input -> first newer frame on screen ---------- */
const latRtt = [], latShow = [], latPending = [];

function pushSample(list, v){ list.push(Math.round(v)); if(list.length > 10) list.shift(); }
function median(list){
  if(!list.length) return null;
  const s = [...list].sort((a, b) => a - b), n = s.length;
  return Math.round((s[(n - 1) >> 1] + s[n >> 1]) / 2);
}
function renderFpsLabel(){
  const m = median(latShow);
  const label = fpsLabel + (m != null ? (fpsLabel ? " · " : "") + "入力 " + m + "ms" : "");
  fpsEl.textContent = label; if(fpsBar) fpsBar.textContent = label;
  if(latRtt.length) fpsEl.title = "入力→表示 直近 " + (latShow.length ? latShow[latShow.length - 1] + "ms" : "—") +
    " / POST往復 直近 " + latRtt[latRtt.length - 1] + "ms・中央値 " + median(latRtt) + "ms";
}
function onFrameDisplayed(counter){
  if(!latPending.length) return;
  const t = performance.now();
  let changed = false;
  for(let i = latPending.length - 1; i >= 0; i--){
    const p = latPending[i];
    if(t - p.t0 > 5000){ latPending.splice(i, 1); continue; }   /* no frame came: drop it, show nothing */
    if(counter > p.counter){ pushSample(latShow, t - p.t0); latPending.splice(i, 1); changed = true; }
  }
  if(changed) renderFpsLabel();
}
/* ---------- input posting ----------
   Discrete events (tap/down/up/key/hover) are always sent, in call order.
   "move" is coalesced: while one move is in flight only the newest is kept. */
const KEY_LABELS = {enter:"決定", escape:"戻る", space:"スペース", e:"ターン終了", tab:"マップ",
  q:"デッキ", a:"山札", d:"捨て札", f:"廃棄", up:"↑", down:"↓", left:"←", right:"→"};
function handCardAt(index){
  const hand = latestState && Array.isArray(latestState.hand) ? latestState.hand : [];
  return hand.find(c => c && c.index === index) || null;
}
function keyLabel(k){
  if(/^[0-9]$/.test(k)){
    const n = k === "0" ? 10 : Number(k), card = handCardAt(n - 1);
    return card && card.name ? n + "：" + card.name : n + "番カード";
  }
  return KEY_LABELS[k] || String(k);
}
function inputLabel(body){
  switch(body && body.type){
    case "key": return keyLabel(body.key);
    case "tap": return "タップ";
    case "rtap": return "右タップ";
    case "down": case "up": return "ドラッグ";
    case "hover": return "長押し確認";
    default: return null;
  }
}
let moveInFlight = false, movePending = null, dragLog = null;
async function postInput(body, label){
  if(body && body.type === "move"){
    if(moveInFlight){ movePending = body; return {ok:true, coalesced:true}; }
    moveInFlight = true;
    let result;
    try{
      result = await sendInputOnce(body);
      while(movePending){ const next = movePending; movePending = null; result = await sendInputOnce(next); }
    }finally{ moveInFlight = false; }
    return result;
  }
  movePending = null;   /* a discrete event supersedes any held (older) intermediate move */
  if(label === undefined) label = inputLabel(body);
  const isUp = body && body.type === "up";
  const entry = label ? logStart(label, isUp ? dragLog : null) : null;
  if(body && body.type === "down") dragLog = entry;
  if(isUp) dragLog = null;
  const t0 = performance.now();
  if(lastCounter >= 0){ latPending.push({t0, counter:lastCounter}); if(latPending.length > 8) latPending.shift(); }

  const result = await sendInputOnce(body);
  if(result.ok){
    pushSample(latRtt, performance.now() - t0); renderFpsLabel();
    setTimeout(() => refreshState(true), 400);
  }
  logEnd(entry, !!result.ok);
  return result;
}

$("tokensave").addEventListener("click", () => {

/* ---------- frame long-polling (works in iOS standalone PWA, unlike MJPEG) ----------

const QUALITY_PRESETS = {
  fast:    {name:"低遅延",   ladder:[1152, 960, 854, 720], start:960,  down:{ms:280, fps:8}, up:{ms:120, fps:12.5}, small:720},
  balanced:{name:"バランス", ladder:[1152, 960, 854],      start:1152, down:{ms:360, fps:7}, up:{ms:150, fps:11},   small:854},
  quality: {name:"高画質",   ladder:[1600, 1366, 1152],    start:1366, down:{ms:480, fps:5}, up:{ms:220, fps:9},    small:null}};
function loadQuality(){   /* Q-12: unset / invalid / unreadable → fast */
  try{ const v = localStorage.getItem("spire_quality"); return Object.prototype.hasOwnProperty.call(QUALITY_PRESETS, v) ? v : "fast"; }catch(e){ return "fast"; }
}
let quality = loadQuality(), preset = QUALITY_PRESETS[quality];
/* Q-6 (1): abort a long-poll still waiting for headers and re-arm at once — every preset */
function abortWaitingPoll(){ if(frameCtl && frameWaiting){ try{ frameCtl.abort(); }catch(e){} } }
/* Called the moment an input is sent. (1) abort + re-arm with since=lastCounter (all presets);
   (2) the width of that one next request depends on the preset: 720 / 854 / unchanged (Q-6, Q-7).
   A download already in progress is never aborted. */
function kickPoll(){
  smallNext = preset.small != null;

}
const fpsBar = $("fpsbar");
let frameWidths = preset.ladder;
let widthIndex = frameWidths.indexOf(preset.start), fastWindows = 0, fetchTotal = 0, fetchCount = 0;
fpsLabel = preset.name;
function updateFrameProfile(){
  const now = Date.now(), elapsed = now - fpsT0;
  if(elapsed < 2500) return;
  const fps = framesShown * 1000 / elapsed;
  const average = fetchCount ? fetchTotal / fetchCount : Infinity;
  if(average > preset.down.ms || fps < preset.down.fps){
    widthIndex = Math.min(frameWidths.length - 1, widthIndex + 1);
    fastWindows = 0;
  } else if(average < preset.up.ms && fps >= preset.up.fps){
    if(++fastWindows >= 3){ widthIndex = Math.max(0, widthIndex - 1); fastWindows = 0; }
  } else { fastWindows = 0; }
  fpsLabel = preset.name + " · " + fps.toFixed(1) + " fps · " + frameWidths[widthIndex] + "px";
  renderFpsLabel();

}
/* Q-13: switch without reload — next request uses the new p and start width, counters reset, toast */
function setQuality(q, silent){
  if(!Object.prototype.hasOwnProperty.call(QUALITY_PRESETS, q)) q = "fast";
  quality = q; preset = QUALITY_PRESETS[q];
  try{ localStorage.setItem("spire_quality", q); }catch(e){}
  frameWidths = preset.ladder; widthIndex = frameWidths.indexOf(preset.start);
  fastWindows = 0; framesShown = 0; fetchTotal = 0; fetchCount = 0; fpsT0 = Date.now(); smallNext = false;

}
async function poll(){
  if(polling) return; polling = true;
  while(true){
    const ctl = new AbortController();
    try{
      const width = smallNext && preset.small ? preset.small : frameWidths[widthIndex];
      smallNext = false;
      /* Q-8: w, then p, then since */
      const url = API_BASE + "api/frame.jpg?w=" + width + "&p=" + quality + (lastCounter >= 0 ? ("&since=" + lastCounter) : "");
      const fetchStarted = performance.now();
      frameCtl = ctl; frameWaiting = true;
      const r = await fetch(url, {headers:{"X-Token":TOKEN}, cache:"no-store", signal:ctl.signal});

    }

}

/* ---------- direct touch on a screen image: tap / drag / long-press zoom ----------

function bindGestures(img, isFs){

    const r = img.getBoundingClientRect();
    const natW = img.naturalWidth || 16, natH = img.naturalHeight || 9;
    const scale = Math.min(r.width / natW, r.height / natH);
    const dispW = natW * scale, dispH = natH * scale;
    const ox = r.left + (r.width - dispW) / 2, oy = r.top + (r.height - dispH) / 2;
    const x = (e.clientX - ox) / dispW, y = (e.clientY - oy) / dispH;
    return {x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y))};

    e.preventDefault(); img.setPointerCapture(e.pointerId);

        g.longPressed = true;

        g.zoomed = true; setGesture(true);
        if(navigator.vibrate) navigator.vibrate(15);
      }
    }, 450);
  });

    if(!g || g.longPressed) return;
    const p = pos(e);
    const dx = p.x - g.sx, dy = p.y - g.sy;
    if(!g.live){ if(Math.hypot(dx, dy) > 0.02){ g.moved = true; clearTimeout(g.timer); } return; }
    if(!g.downSent && Math.hypot(dx, dy) > 0.02){
      clearTimeout(g.timer);

      postInput({type:"move", x:p.x, y:p.y});

    const sx = g.sx, sy = g.sy, lx = g.lx, ly = g.ly;
    g = null; setGesture(false);

      if(!moved && Date.now() - touchOffToastAt >= 10000){ touchOffToastAt = Date.now(); showToast("画面タッチはオフです。👆 でオンにできます"); }
      return;
    }
    noteTouch();
    if(wasDown){ postInput({type:"up", x:lx, y:ly}, "ドラッグ"); }

}

    if(actionBusy) return false;

    if(opts.verify){                                                  /* F-5: re-fetch and compare before /do */
      const [st, acts] = await Promise.all([api("api/state"), api("api/actions")]);
      const fresh = st && !st.error && Array.isArray(acts);
      if(!fresh || !selMatches(st, opts.check, acts, aid)){
        entry.label = "状態が変わったため中止しました"; logEnd(entry, false);
        setFlowNote("状態が変わったため中止しました", true);
        if(fresh){ latestState = st; stateActions = acts; enemyInfo = enemyList(st); }
        return false;

/* ---------- W3: enemy badges, target arrow, ring (A-1..A-13) ----------

function posToBox(pos, boxW, boxH, natW, natH){

function computeArrowModel(boxW, boxH, natW, natH){

  const base = posToBox({x:0, y:0}, boxW, boxH, natW, natH);
  m.clip = {x:base.ox, y:base.oy, w:base.dispW, h:base.dispH};
  const tgt = sel && sel.target != null ? sel.target : null;
  const peekI = enemyPeek && Date.now() < enemyPeek.until ? enemyPeek.index : null;
  const picking = !!sel && sel.needsTarget && sel.target == null;   /* C2: no arrow, candidate badges blink */
  for(const x of enemyInfo.live){
    if(!x.pos) continue;                                             /* A-10: never drawn without a position */
    const b = posToBox(x.pos, boxW, boxH, natW, natH);
    const big = x.index === tgt || (tgt == null && x.index === peekI);
    const cand = picking && hasAction(sel.kind + ":" + sel.index + ":" + x.index);
    m.badges.push({index:x.index, label:x.label, x:b.x, y:b.y, r: big ? 13 : 10, big, blink:cand});
    if(big) m.ring = {index:x.index, x:b.x - b.w / 2, y:b.y - b.h / 2, w:b.w, h:b.h};

      '<text x="' + r1(b.x) + '" y="' + r1(b.y) + '" text-anchor="middle" dominant-baseline="central" fill="#fff" font-size="' + (b.big ? 14 : 11) + '" font-weight="800">' + svgEsc(b.label) + '</text></g>');

async function refreshState(force=false){
  if(stateBusy || actionBusy || !stateVisible() || (!force && Date.now() < stateNextAt)) return;
  stateBusy = true; stateNextAt = Date.now() + 1500;
  let done; stateDone = new Promise(r => { done = r; });
  try{
    const [state, actions] = await Promise.all([api("api/state"), api("api/actions")]);
    if(state.error || !Array.isArray(actions)){
      clearStateActions();
      const error = state.error || actions.error || "bridge_bad_response";
      setBandsOffline(error === "bridge_unreachable" || error === "network" ? "ブリッジ未接続" : "状態取得失敗");
      stateNextAt = Date.now() + 5000;
      renderAll();
      return;
    }
    renderState(state, actions);
  }catch(e){
    clearStateActions(); setBandsOffline("状態取得失敗"); stateNextAt = Date.now() + 5000; renderAll();

/* ---------- layout (L-5..L-9): one pure function, applied to the DOM by applyLayout ----------
   avail = effH − 8 − Z1 − Z4 − 12; band = clamp(0, floor((avail − videoH − z3Need)/2), 52);
   Z2 = videoH + 2×band; Z3 = the rest. videoW = viewport width − 8, videoH = round(videoW × natH/natW). */
const LAYOUT = {z1:32, rowA:36, rowB:52, gap:4, bandMax:52, bandMin:24, desc:34, z2Min:120, z3Min:208};
function computeLayout(vw, effH, natW, natH, z3Need){
  if(!(natW > 0 && natH > 0)){ natW = 16; natH = 9; }
  const L = LAYOUT;
  const z4 = L.rowA + L.gap + L.rowB;
  const videoW = vw - 8;
  let videoH = Math.round(videoW * natH / natW);
  let avail = effH - 8 - L.z1 - z4 - 3 * L.gap;
  let band = Math.max(0, Math.min(L.bandMax, Math.floor((avail - videoH - z3Need) / 2)));
  let descRow = false, rowAHidden = false, shrunk = false;
  if(band < L.bandMin){
    /* step 2: bands off, description row (34px) at the top of Z3, bottom-band context into Z1 */
    band = 0; descRow = true;
    const need = z3Need + L.desc + L.gap;
    if(avail - videoH < need){
      /* step 3: row A moves into the ☰ menu (36 + 4 recovered) */
      rowAHidden = true; avail += L.rowA + L.gap;
      if(avail - videoH < need){
        /* step 4: shrink the picture (aspect kept), Z2 never below 120px */
        videoH = Math.max(L.z2Min, avail - need); shrunk = true;
      }
    }
  }
  const z2 = videoH + 2 * band;
  return {videoW: shrunk ? Math.round(videoH * natW / natH) : videoW, videoH, avail, band, z2, z3: avail - z2, descRow, rowAHidden, shrunk};
}
/* L-7: Z3 need — combat 208 (+48 when the enemy row wraps), choice screens rows×48 + 52 + 8 */
function z3NeedFor(st){
  if(!st || !bridgeOk) return LAYOUT.z3Min;
  if(st.screen === "combat") return LAYOUT.z3Min + (enemyList(st).live.length > 4 ? 48 : 0);
  if(SCREEN_KIND[st.screen]){
    const n = choiceItems(st.screen).length;
    const rows = n <= 3 ? n : Math.min(4, Math.ceil(n / 2));
    return Math.max(LAYOUT.z3Min, rows * 48 + 52 + 8);
  }
  return LAYOUT.z3Min;
}
function isLandscapePhone(){

}
let lastLayout = null;
function applyLayout(){
  const body = document.body;
  const box = screenBox.getBoundingClientRect(), app = $("app").getBoundingClientRect();
  if(isLandscapePhone() || !(box.width > 0) || !(app.height > 0)){
    screenBox.style.height = ""; lastLayout = null;

  }

/* ---------- letterbox bands: top = focus name/description, bottom = context ---------- */
const screenBox = $("screenbox"), bandTop = $("bandtop"), bandBottom = $("bandbottom");
let bandH = 0, bandKey = "", latestState = null, bandConn = "";
function layoutBands(force){
  const natW = screenImg.naturalWidth || 0, natH = screenImg.naturalHeight || 0;
  const r = screenBox.getBoundingClientRect();
  const key = natW + "x" + natH + "@" + Math.round(r.width) + "x" + Math.round(r.height);
  if(!force && key === bandKey) return;
  bandKey = key;
  let h = 0;
  if(natW > 0 && natH > 0 && r.width > 0 && r.height > 0){
    const scale = Math.min(r.width / natW, r.height / natH);
    h = Math.floor((r.height - natH * scale) / 2);
  }
  const was = bandH;
  bandH = h >= LAYOUT.bandMin ? h : 0;   /* L-9: under 24px the bands are hidden (description row instead); never over the picture */
  for(const el of [bandTop, bandBottom]){
    if(bandH){ el.style.height = bandH + "px"; el.classList.add("on"); }
    else el.classList.remove("on");
  }
  const body = document.body;
  if(body && body.classList){ if(bandH) body.classList.remove("noband"); else body.classList.add("noband"); }
  if(bandH !== was) renderBands();
  if(bandH && !was) refreshState(true);

/* F-11 ①: what the flow UI has selected (= what the confirm button will execute) */
function uiFocus(st){

    let name, desc = clean(it.description);
    if(sel.type === "card") name = circ(it.index + 1) + " " + clean(it.name) + (typeof it.cost === "number" ? " " + costShown(it, cardUsable(it)) : "");
    else if(sel.type === "potion") name = "P" + (it.index + 1) + " " + clean(it.name);
    else { name = selName(); if(sel.kind === "choose_map") desc = clean(it.label) !== name ? clean(it.label) : desc; }

  }

function bandFocus(st){
  const hand = Array.isArray(st.hand) ? st.hand : [];
  const choices = Array.isArray(st.choices) ? st.choices : [];
  /* ① flow UI selection */
  const ui = uiFocus(st);
  if(ui) return ui;
  /* ② bridge-reported selection (game-side focus) */
  const sel2 = st.selected;
  if(sel2 && typeof sel2 === "object"){
    const lists = {card: hand, choice: choices, potion: st.potions, enemy: st.enemies};
    const list = Array.isArray(lists[sel2.kind]) ? lists[sel2.kind] : [];
    const item = sel2.index != null ? list.find(x => x && x.index === sel2.index) : null;
    let name = clean(sel2.name), desc = clean(sel2.description);
    if(item){
      if(!name) name = clean(item.name || item.label);
      if(!desc) desc = clean(item.description != null ? item.description : (sel2.kind === "enemy" && item.intent != null ? "インテント: " + item.intent : ""));
      if(sel2.kind === "card" && item.cost != null && name === clean(item.name)) name += " ⚡" + item.cost;
    }
    if(name) return {name, desc};
  }

  if(st.screen === "combat" || hand.length){
    if(!hand.length) return {name:"", desc:""};

    return {name: choices.map(c => clean(c.label)).join(" / "),

function bandContext(st){

  if(p){
    if(p.hp != null) parts.push("HP " + p.hp + "/" + val(p.max_hp));
    if(p.block) parts.push("🛡" + p.block);
    if(p.energy != null) parts.push("⚡" + p.energy + "/" + val(p.max_energy));
  }
  if(run){
    if(run.gold != null) parts.push("💰" + run.gold);
    if(run.act != null || run.floor != null) parts.push("Act " + val(run.act) + " · " + val(run.floor) + "F");
  }

    sub = enemyList(st).live.map(x => enemyName(x) + " " + val(x.e.hp) + "/" + val(x.e.max_hp) + (x.e.block ? " 🛡" + x.e.block : "") + (x.e.intent != null ? " " + clean(x.e.intent) : "")).join(" | ");

  return [parts.join(" · "), sub];
}
function setText(el, text){ if(el.textContent !== text) el.textContent = text; }
function renderBands(){
  const st = latestState;
  let focus = {name:"", desc:""}, ctx = [bandConn, ""];
  if(st && st.screen !== "unknown"){
    focus = bandFocus(st);
    ctx = bandContext(st);
    if(!ctx[0] && !ctx[1]) ctx = [bandConn, ""];
  }
  setText($("bandname"), focus.name); setText($("banddesc"), focus.desc);
  setText($("bandl1"), ctx[0]); setText($("bandl2"), ctx[1]);
  /* L-9 step 2: the same focus goes to the description row, the context to Z1 */
  setText($("descname"), focus.name); setText($("descdesc"), focus.desc);
  setText($("z1ctx"), ctx[0]);
}
screenImg.addEventListener("load", () => { onFrameDisplayed(shownCounter); applyLayout(); layoutBands(false); });
if(typeof ResizeObserver !== "undefined"){ try{ new ResizeObserver(() => { layoutBands(true); renderArrows(); }).observe(screenBox); }catch(e){} }
/* ---------- fullscreen ---------- */
const fsEl = $("fs");
function openFs(){
  fsEl.classList.add("open");
  try{ const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if(p && p.catch) p.catch(()=>{}); }catch(e){}
  try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(()=>{}); }catch(e){}
}
function closeFs(){
  fsEl.classList.remove("open");
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  try{ if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
}
$("fsbtn").addEventListener("click", openFs);
$("fsclose").addEventListener("click", closeFs);
$("fsaudio").addEventListener("click", () => $("audiobtn").click());
/* ---------- launch / quit (quit only from the ☰ menu, always behind a confirm dialog) ---------- */
function askConfirm(msg){ try{ return typeof confirm === "function" ? !!confirm(msg) : false; }catch(e){ return false; } }
async function launchGame(){
  showToast("Steamから起動しています…", 5000);
  const r = await api("api/launch", {});
  showToast(r.ok ? "起動を開始しました" : ("起動失敗: " + (r.error || "")), 4000);
  setTimeout(refreshStatus, 1500);
}
$("launch").addEventListener("click", () => { closeMenu(); launchGame(); });
async function quitGame(force){
  const r = await api("api/quit", {force: !!force});
  showToast(r.ok ? "終了しました" : ("終了失敗: " + (r.error || "")));
  setTimeout(refreshStatus, 800);
}
$("quit").addEventListener("click", () => { if(askConfirm("ゲームを終了しますか？")) return quitGame(false); });
$("forcequit").addEventListener("click", () => { if(askConfirm("ゲームを強制終了しますか？")) return quitGame(true); });
$("focus").addEventListener("click", async () => { lastCounter = -1; const r = await api("api/focus", {}); showToast(r.ok ? "再接続しました" : "再接続に失敗"); refreshStatus(); });
document.addEventListener("visibilitychange", () => { if(!document.hidden){ lastCounter = -1; refreshStatus(); } });
/* ---------- press feedback for every <button> ---------- */
document.addEventListener("pointerdown", e => {
  const b = e.target && e.target.closest ? e.target.closest("button") : null;
  if(!b || b.disabled) return;
  b.classList.add("pressed");
  clearTimeout(b._pressTimer);
  b._pressTimer = setTimeout(() => b.classList.remove("pressed"), 160);
}, {capture:true, passive:true});
/* ---------- real viewport height (iOS standalone can under-report 100dvh) ---------- */
function setAppHeight(){
  try{ document.documentElement.style.setProperty("--app-height", window.innerHeight + "px"); }catch(e){}
  applyLayout();
  layoutBands(true);
}
setAppHeight();
window.addEventListener("resize", setAppHeight);
window.addEventListener("orientationchange", () => { setAppHeight(); setTimeout(setAppHeight, 350); });
if(window.visualViewport) window.visualViewport.addEventListener("resize", setAppHeight);
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
syncTokenUI();
renderAll();
(async () => { await probeBase(); refreshStatus(); setInterval(refreshStatus, 6000); refreshState(); setInterval(refreshState, 1500); poll(); })();
</script>
